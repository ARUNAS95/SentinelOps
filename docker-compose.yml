services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: kms,secretsmanager,sts
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DISABLE_CORS_CHECKS: "1"
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINELOPS_LOCAL_AWS_ENDPOINT: http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy

  terraform:
    image: hashicorp/terraform:1.10
    working_dir: /workspace
    entrypoint: ["terraform"]
    command: ["version"]
    volumes:
      - ./infra/localstack:/workspace
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    profiles: ["infra"]
    depends_on:
      localstack:
        condition: service_healthy
