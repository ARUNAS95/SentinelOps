services:
  moto:
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MOTO_PORT: "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINELOPS_LOCAL_AWS_ENDPOINT: http://moto:5000
    depends_on:
      moto:
        condition: service_healthy

  terraform:
    image: hashicorp/terraform:1.10
    working_dir: /workspace
    entrypoint: ["terraform"]
    command: ["version"]
    volumes:
      - ./infra/local-aws:/workspace
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    profiles: ["infra"]
    depends_on:
      moto:
        condition: service_healthy
