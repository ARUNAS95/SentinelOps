name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: terraform -chdir=infra/localstack fmt -check -recursive
      - run: terraform -chdir=infra/localstack init -backend=false
      - run: terraform -chdir=infra/localstack validate
      - run: docker compose config --quiet
      - run: docker build -t sentinelops:ci .
      - run: python -m pip install pip-audit
      - run: pip-audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
