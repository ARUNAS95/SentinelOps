name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: terraform -chdir=infra/localstack fmt -check -recursive
      - run: terraform -chdir=infra/localstack init -backend=false
      - run: terraform -chdir=infra/localstack validate
      - run: docker compose config --quiet
      - run: docker build -t sentinelops:ci .
      - name: LocalStack KMS and Secrets Manager smoke test
        run: |
          set -euo pipefail
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up -d --build localstack api
          docker compose --profile infra run --rm terraform init
          docker compose --profile infra run --rm terraform apply -auto-approve
          key_id="$(docker compose --profile infra run --rm terraform output -raw kms_key_id)"
          secret_id="$(docker compose --profile infra run --rm terraform output -raw secret_id)"
          docker compose exec -T api sentinelops local-aws-check --key-id "$key_id" --secret-id "$secret_id"
      - run: python -m pip install pip-audit
      - run: pip-audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
