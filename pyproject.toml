[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="sentinelops"
version="0.1.0"
description="Safe-by-default cloud security triage lab"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.6,<1"]
[project.scripts]
sentinelops="sentinelops.cli:main"
[tool.setuptools.packages.find]
include=["sentinelops*"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.ruff]
line-length=100
target-version="py311"
